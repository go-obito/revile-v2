[project]
name = "revile-v2"
version = "0.1.0"
description = "News-first technology publication backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.5",
    "apscheduler>=3.11.0",
    "asyncpg>=0.30.0",
    "bleach>=6.2.0",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.2.4",
    "imagekitio>=5.10.0",
    "markdown-it-py>=4.0.0",
    "pydantic-settings>=2.10.1",
    "pyjwt>=2.10.1",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.53",
    "structlog>=25.4.0",
    "pwdlib[argon2]>=0.2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
